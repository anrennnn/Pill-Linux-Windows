name: Release

# Publica una versión al subir una etiqueta (git tag v0.2.0 && git push origin v0.2.0)
# o a mano desde la pestaña Actions. La Release se crea como borrador para revisarla.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - run: npm ci

      # Las actualizaciones automáticas necesitan la clave privada como secreto del repositorio.
      # Sin ella, se publican los instaladores igualmente, pero sin actualizaciones firmadas.
      # Comprobamos la clave antes de compilar: al pegarla en GitHub es fácil que se cuele
      # un salto de línea o un espacio, y entonces la firma falla al final del build.
      - name: Preparar la firma de actualizaciones
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::warning::Falta el secreto TAURI_SIGNING_PRIVATE_KEY: esta versión no tendrá actualizaciones automáticas."
            exit 0
          fi
          key="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          echo "::add-mask::$key"
          echo "firma de prueba" > firma-prueba.txt
          if out="$(npx tauri signer sign -k "$key" -p "$KEY_PASSWORD" firma-prueba.txt 2>&1)"; then
            {
              echo "SIGNING_KEY=$key"
              echo "SIGNING_PASSWORD=$KEY_PASSWORD"
              echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json"
            } >> "$GITHUB_ENV"
            echo "Clave de firma válida."
          elif echo "$out" | grep -q "decode base64"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY no es una clave privada válida (¿texto incompleto o de otro archivo?). Se publica sin actualizaciones automáticas."
          elif echo "$out" | grep -q "password"; then
            echo "::error::La clave no se abre con TAURI_SIGNING_PRIVATE_KEY_PASSWORD (si la clave no tiene contraseña, borra ese secreto; o se pegó la clave pública). Se publica sin actualizaciones automáticas."
          else
            echo "::error::No se pudo firmar con la clave: $(echo "$out" | tail -1)"
          fi
          rm -f firma-prueba.txt firma-prueba.txt.sig

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.SIGNING_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: FocusPill v__VERSION__
          releaseBody: |
            Instaladores de FocusPill v__VERSION__.

            - **Linux:** `.deb` (Ubuntu, Debian, Mint, Pop!_OS), `.rpm` (Fedora, openSUSE) o `.AppImage` (cualquier distro).
            - **Windows:** `.msi` o instalador `.exe`.

            Los instaladores de Windows no están firmados: SmartScreen puede pedir confirmación («Más información → Ejecutar de todos modos»).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} ${{ env.UPDATER_ARGS }}
