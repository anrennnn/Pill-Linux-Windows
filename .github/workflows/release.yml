name: Release

# Publica una versión al subir una etiqueta (git tag v0.2.0 && git push origin v0.2.0)
# o a mano desde la pestaña Actions. La Release se crea como borrador para revisarla.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - run: npm ci

      # Las actualizaciones automáticas necesitan la clave privada como secreto del repositorio.
      # Sin ella, se publican los instaladores igualmente, pero sin actualizaciones firmadas.
      - name: Firmar actualizaciones si hay clave
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto TAURI_SIGNING_PRIVATE_KEY: esta versión no tendrá actualizaciones automáticas."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: FocusPill v__VERSION__
          releaseBody: |
            Instaladores de FocusPill v__VERSION__.

            - **Linux:** `.deb` (Ubuntu, Debian, Mint, Pop!_OS), `.rpm` (Fedora, openSUSE) o `.AppImage` (cualquier distro).
            - **Windows:** `.msi` o instalador `.exe`.

            Los instaladores de Windows no están firmados: SmartScreen puede pedir confirmación («Más información → Ejecutar de todos modos»).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} ${{ env.UPDATER_ARGS }}
