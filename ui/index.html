<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusPill</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="island" class="island mode-pill">
    <!-- Píldora cerrada -->
    <div class="pill" id="pill">
      <span class="dot" id="pillDot"></span>
      <span class="pill-art" id="pillArt" hidden></span>
      <span class="pill-label" id="pillLabel">FocusPill</span>
      <span class="eq" id="pillEq" hidden title="Música: pasa el ratón para ver los controles"><i></i><i></i><i></i></span>
      <span class="pill-meta" id="pillMeta"></span>
      <button class="pill-btn" id="pillPlay" aria-label="Iniciar o pausar foco"></button>
      <div class="pill-progress"><i id="pillProgress"></i></div>
    </div>

    <!-- Captura rápida -->
    <form class="capture" id="capture" autocomplete="off">
      <span class="dot dot-accent"></span>
      <input id="captureInput" placeholder="Captura algo…  (!  = hoy · n:  = nota)" spellcheck="false" />
      <span class="chip" id="captureDest">Bandeja</span>
    </form>

    <!-- Música (isla expandida) -->
    <div class="media" id="mediaView"></div>

    <!-- Panel expandido -->
    <div class="panel" id="panel">
      <header class="panel-head">
        <div class="status">
          <span class="dot" id="headDot"></span>
          <span class="status-label" id="headLabel"></span>
          <span class="status-time" id="headTime"></span>
        </div>
        <button class="icon-btn" id="collapseBtn" aria-label="Plegar" title="Plegar (Esc)"></button>
      </header>

      <nav class="tabs" id="tabs">
        <button data-tab="today">Hoy</button>
        <button data-tab="focus">Foco</button>
        <button data-tab="notes">Notas</button>
        <button data-tab="stats">Progreso</button>
        <button data-tab="ai" class="tab-ai">IA</button>
        <button data-tab="settings" aria-label="Ajustes" title="Ajustes"></button>
      </nav>

      <div class="views">
        <!-- HOY -->
        <section class="view" data-view="today">
          <form id="todayForm" class="add-row" autocomplete="off">
            <input id="todayInput" placeholder="Añade una prioridad para hoy…" spellcheck="false" />
            <button class="add-btn" aria-label="Añadir"></button>
          </form>
          <div class="modes" id="modesBox"></div>
          <div id="agendaBox"></div>
          <div class="goal" id="goal"></div>
          <div class="habits" id="habitsBox"></div>

          <div class="section-title"><span>Prioridades</span><span id="todayCount" class="muted"></span></div>
          <ul class="list" id="todayList"></ul>

          <details class="fold" id="doneFold">
            <summary><span>Hechas hoy</span><span id="doneCount" class="muted"></span></summary>
            <ul class="list compact" id="doneList"></ul>
          </details>

          <div class="section-title">
            <span>Bandeja <span id="inboxCount" class="muted"></span></span>
            <button class="link-btn" id="todoistBtn" hidden title="Importar tareas de hoy desde Todoist"></button>
          </div>
          <ul class="list" id="inboxList"></ul>

          <details class="fold" id="schedFold">
            <summary><span>Programadas</span><span id="schedCount" class="muted"></span></summary>
            <ul class="list compact" id="schedList"></ul>
          </details>
        </section>

        <!-- FOCO -->
        <section class="view" data-view="focus">
          <div class="now-playing" id="nowPlaying" hidden></div>
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="ring-track" cx="100" cy="100" r="86" />
              <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="86" />
            </svg>
            <div class="ring-center">
              <div class="ring-phase" id="ringPhase">Listo</div>
              <div class="ring-time" id="ringTime">25:00</div>
              <div class="ring-cycle" id="ringCycle"></div>
            </div>
          </div>

          <label class="field">
            <span>Trabajando en</span>
            <select id="focusTask"></select>
          </label>

          <div class="controls">
            <button class="btn ghost" id="resetBtn">Reiniciar</button>
            <button class="btn primary" id="startBtn">Empezar</button>
            <button class="btn ghost" id="skipBtn">Saltar</button>
          </div>

          <div class="presets" id="presets">
            <button data-preset="25,5">25 / 5</button>
            <button data-preset="50,10">50 / 10</button>
            <button data-preset="90,15">90 / 15</button>
            <button data-preset="15,3">15 / 3</button>
          </div>

          <div class="set-group">
            <div class="set-title">Ambiente</div>
            <div class="presets left" id="ambient"></div>
            <div class="slider-row"><span class="muted">Volumen</span><input type="range" id="ambientVol" min="0" max="1" step="0.05" /></div>
            <label class="toggle"><input type="checkbox" id="ambientWithFocus" /><span>Sonar solo durante el foco</span></label>
            <label class="toggle" id="dndRow"><input type="checkbox" id="dndToggle" /><span>«No molestar» durante el foco</span></label>
            <label class="toggle"><input type="checkbox" id="distractToggle" /><span>Avisarme si me distraigo</span></label>
          </div>
        </section>

        <!-- NOTAS -->
        <section class="view" data-view="notes">
          <form id="noteForm" class="note-form" autocomplete="off">
            <textarea id="noteInput" rows="3" placeholder="Escribe una idea, un apunte, un enlace…  (Ctrl+Enter para guardar)"></textarea>
            <button class="btn primary small">Guardar nota</button>
          </form>
          <ul class="notes" id="noteList"></ul>
        </section>

        <!-- IA -->
        <section class="view" data-view="ai">
          <div id="aiConnect"></div>
          <div id="aiActions" class="ai-actions">
            <button class="ai-btn" id="planBtn"><b>Planificar mi día</b><small>Bloques alrededor de tus reuniones</small></button>
            <button class="ai-btn" id="closeBtn"><b>Cierre del día</b><small>Qué hiciste y qué queda</small></button>
            <button class="ai-btn" id="weeklyBtn"><b>Revisión semanal</b><small>Patrones y prioridades del lunes</small></button>
          </div>
          <p class="hint provider" id="aiProviderLabel"></p>
          <div id="aiPlan"></div>
          <div id="aiClose"></div>
          <div id="aiWeekly"></div>
          <div id="aiChat"></div>
          <form id="askForm" class="add-row ask" autocomplete="off">
            <input id="askInput" placeholder="Pregunta algo sobre tu día…" spellcheck="false" />
            <button class="add-btn" aria-label="Enviar">➤</button>
          </form>
        </section>

        <!-- PROGRESO -->
        <section class="view" data-view="stats">
          <div class="kpis" id="kpis"></div>
          <div class="section-title"><span>Minutos de foco · 7 días</span></div>
          <div class="bars" id="bars"></div>
          <div id="habitStats"></div>
          <div class="section-title">
            <span>Tiempo real por aplicación</span>
            <div class="seg mini" id="rangeSeg"><button data-range="today">Hoy</button><button data-range="week">7 días</button></div>
          </div>
          <div id="appsBox"></div>
          <div class="section-title"><span>Dónde se fue tu foco esta semana</span></div>
          <ul class="list compact" id="topTasks"></ul>
        </section>

        <!-- AJUSTES -->
        <section class="view" data-view="settings">
          <div id="settingsBox"></div>
        </section>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
